  <script src="pwa.js?v=1.20.6"></script>
  <script>
    let allItems = [];
    let currentAction = '';
    let currentTopMode = 'log'; // 'log' | 'inventory'
    let currentInvTab = 'attention'; // 'attention' | '2026' | '2021' | '2015' | 'class'
    let classStockToolNames = new Set();

    function updateClassStockToolNames(rows) {
      classStockToolNames = new Set((rows || []).map(function(row) {
        return String(row.tool || '').trim().toLowerCase();
      }).filter(Boolean));
    }

    function isClassStockTool(itemName) {
      return classStockToolNames.has(String(itemName || '').trim().toLowerCase());
    }
    function classStockRowForItem(itemName) {
      const target = String(itemName || '').trim().toLowerCase();
      return (invCache['class'] || []).find(function(row) {
        return String(row.tool || '').trim().toLowerCase() === target;
      }) || null;
    }

    function exactKnownItemName(itemName) {
      const target = String(itemName || '').trim().toLowerCase();
      return allItems.find(function(item) {
        return String(item || '').trim().toLowerCase() === target;
      }) || '';
    }

    function matchingVanRowsForItem(itemName) {
      const target = String(itemName || '').trim().toLowerCase();
      const rows = [];
      ['2015', '2021', '2026'].forEach(function(tab) {
        (invCache[tab] || []).forEach(function(row) {
          if (String(row.item || '').trim().toLowerCase() === target) {
            rows.push(Object.assign({ _tab: tab }, row));
          }
        });
      });
      return rows;
    }

    // Status-only replenishment items are bulk supplies represented as:
    // 1 = stocked / 0 = needs replenishing.
    //
    // This is an explicit list so ordinary inventory items with a baseline of 1
    // are NOT accidentally treated as replenishment-status supplies.
    function normalizeReplenishmentName(itemName) {
      return String(itemName || '')
        .trim()
        .toLowerCase()
        .replace(/[“”″]/g, '"')
        .replace(/[‘’]/g, "'")
        .replace(/\s*\/\s*/g, '/')
        .replace(/\s+/g, ' ');
    }

    const REPLENISHMENT_STATUS_ITEMS = new Set([
      'nails',
      'coping saw blades',
      'wheel pegs',
      'wheels',
      'hinge',
      'hook',
      'hair tie',
      'pilot bit',
      'rubber band',
      'pencil',
      'pen',
      'mini dowel stick',
      'glue',
      'extra wheel bin',
      'badge/sticker organizer',
      'first aid kit/de choker',
      'scrap wood',
      'spin top/pull string/backup handle',
      'big dowel stick',
      'small dowel stick',
      'small dowell stick',
      'emergen-c packet',
      'wa business card',
      'music player'
    ]);

    function isReplenishmentStatusItem(itemName) {
      const exact = exactKnownItemName(itemName);
      if (!exact) return false;

      const name = normalizeReplenishmentName(exact);

      // Screws: every screw type belongs in this status group.
      if (/\bscrews?\b/.test(name)) return true;

      // Nails: singular or plural, including sizes such as 1.25" nail(s) and named types.
      if (/\bnails?\b/.test(name)) return true;

      // All actual drills and drivers are status items, but ordinary drill bits are not.
      // Pilot bit remains included explicitly above.
      if ((/\bdrills?\b/.test(name) || /\bdrivers?\b/.test(name)) && !/\bbits?\b/.test(name)) return true;

      // Batteries are status items; battery chargers/charging accessories are not.
      if (/\bbatter(?:y|ies)\b/.test(name) && !/\bcharg(?:er|ers|ing)\b/.test(name)) return true;

      // All board supplies are replenishment-status items, regardless of size or naming variant.
      if (/\bboards?\b/.test(name)) return true;

      // All dowel supplies are replenishment-status items. Also accept the existing
      // "dowell" misspelling so current sheet names continue to work.
      if (/\bdowell?s?\b/.test(name)) return true;

      return REPLENISHMENT_STATUS_ITEMS.has(name);
    }

    function rowForVanLocation(itemName, location) {
      const exact = exactKnownItemName(itemName);
      if (!exact) return null;
      let tab = '';
      if (String(location).includes('2015')) tab = '2015';
      else if (String(location).includes('2021')) tab = '2021';
      else if (String(location).includes('2026')) tab = '2026';
      if (!tab) return null;

      let rows = (invCache[tab] || []).filter(function(row) {
        return String(row.item || '').trim().toLowerCase() === exact.toLowerCase();
      });

      if (tab === '2026' && rows.length > 1) {
        const loc = String(location);
        if (loc === '2026 Van Floor' || loc === '2026 Van Floor Level') {
          rows = rows.filter(function(row) {
            const where = (String(row.area || '') + ' ' + String(row.bin || '')).toLowerCase();
            return where.includes('floor') || where.includes('bottom');
          });
        } else if (loc === '2026 2nd Level' || loc === '2026 Van 2nd Level') {
          rows = rows.filter(function(row) {
            const where = (String(row.area || '') + ' ' + String(row.bin || '')).toLowerCase();
            return where.includes('2nd') || where.includes('second') || where.includes('middle');
          });
        } else if (loc === '2026 Van Other') {
          rows = rows.filter(function(row) {
            const where = (String(row.area || '') + ' ' + String(row.bin || '')).toLowerCase();
            return !where.includes('floor') && !where.includes('bottom') &&
              !where.includes('2nd') && !where.includes('second') && !where.includes('middle');
          });
        }
      }

      return rows.length === 1 ? rows[0] : null;
    }

    function updateChoiceTileLabel(selectId, value, label) {
      const select = document.getElementById(selectId);
      if (!select) return;
      const optionIndex = Array.from(select.options).findIndex(function(option) {
        return option.value === value;
      });
      if (optionIndex < 0) return;
      select.options[optionIndex].textContent = label;
      const grid = document.getElementById(selectId + 'TileGrid');
      if (grid && grid.children[optionIndex]) {
        grid.children[optionIndex].textContent = label;
      }
    }

    function setStatusQuantityMode(enabled) {
      const quantity = document.getElementById('quantity');
      const minus = document.getElementById('qtyMinusBtn');
      const plus = document.getElementById('qtyPlusBtn');
      const label = document.getElementById('quantityLabel');
      if (!quantity || !minus || !plus || !label) return;

      if (enabled) {
        quantity.value = '1';
        quantity.readOnly = true;
        minus.disabled = true;
        plus.disabled = true;
        minus.classList.add('opacity-40');
        plus.classList.add('opacity-40');
        label.textContent = 'Status Qty';
      } else {
        quantity.readOnly = false;
        minus.disabled = false;
        plus.disabled = false;
        minus.classList.remove('opacity-40');
        plus.classList.remove('opacity-40');
        label.textContent = 'Quantity';
      }
    }

    function configureSelectedItemMode() {
      const itemName = exactKnownItemName(document.getElementById('itemSearch').value);
      const statusItem = isReplenishmentStatusItem(itemName);

      const needsLabel = document.getElementById('tabNeedsReplacementLabel');
      const restockLabel = document.getElementById('tabRestockReplaceLabel');
      if (needsLabel) needsLabel.textContent = statusItem ? 'Needs replenishing / recharging' : 'Needs replacement / replenishing';
      if (restockLabel) restockLabel.textContent = statusItem ? 'Replenished / Recharged' : 'Restocked / Replaced';

      if (currentAction === 'Needs replacement') {
        setStatusQuantityMode(statusItem);
        const locLabel = document.getElementById('needsReplacementLocationLabel');
        const questionLabel = document.getElementById('needsReplacementQuestionLabel');
        if (locLabel) locLabel.textContent = statusItem
          ? 'Which van/location needs replenishing / recharging?'
          : 'Which van/location needs replacement?';
        if (questionLabel) questionLabel.textContent = statusItem
          ? 'Did you replenish / recharge it?'
          : 'Did you replace them?';

        updateChoiceTileLabel('needsReplacementStatus', 'Not replaced yet',
          statusItem ? 'Not replenished / recharged yet' : 'Not replaced yet');
        updateChoiceTileLabel('needsReplacementStatus', 'Restocked from tool room',
          statusItem ? 'Replenished / Recharged' : 'Restocked from Tool Room');

        const qtyWrap = document.getElementById('needsRestockQtyWrap');
        if (statusItem) {
          document.getElementById('needsRestockQty').value = '1';
          if (qtyWrap) qtyWrap.classList.add('hidden');
        } else {
          onNeedsReplacementChange(document.getElementById('needsReplacementStatus').value);
        }
      } else if (currentAction === 'Restock / Replace') {
        setStatusQuantityMode(statusItem);
        configureRestockReplaceForItem();
        const destinationLabel = document.getElementById('transferDestinationLabel');
        if (statusItem && destinationLabel) destinationLabel.textContent = 'Replenished / Recharged in';
      } else {
        setStatusQuantityMode(false);
      }
    }

    function configureRestockReplaceForItem(preferredSource) {
      const from = document.getElementById('transferMovedFrom');
      const to = document.getElementById('transferMovedTo');
      const sourceLabel = document.getElementById('transferSourceLabel');
      const destinationLabel = document.getElementById('transferDestinationLabel');
      if (!from || !to || !document.getElementById('transferMovedFromTileGrid')) return;

      const typedItem = document.getElementById('itemSearch').value;
      const itemName = exactKnownItemName(typedItem);

      // Until an exact inventory item is selected, don't guess a source.
      if (!itemName) {
        filterLocationTiles(from, function(value) {
          return ['Tool Room', 'Repaired Bin', 'Class Stock'].includes(value);
        });
        from.selectedIndex = -1;
        if (sourceLabel) sourceLabel.textContent = 'Source';
        if (destinationLabel) destinationLabel.textContent = 'Restocked / replaced in';
        syncChoiceTiles(from);
        return;
      }

      if (!isClassStockTool(itemName)) {
        const chosenSource = ['Repaired Bin', 'Class Stock', 'Tool Room'].includes(preferredSource)
          ? preferredSource
          : 'Tool Room';
        filterLocationTiles(from, function(value) { return value === chosenSource; });
        from.value = chosenSource;
        const statusItem = isReplenishmentStatusItem(itemName);
        if (sourceLabel) sourceLabel.textContent = chosenSource === 'Tool Room' ? 'Source' : 'Replacement source';
        if (destinationLabel) destinationLabel.textContent = chosenSource === 'Tool Room'
          ? (statusItem ? 'Replenished / Recharged in' : 'Restocked in')
          : 'Replaced in';
        syncChoiceTiles(from);
        return;
      }

      // Class-stock tools can be replaced from Repaired Bin or Class Stock.
      // Use current inventory to make the obvious source automatic when only
      // one currently has stock. If both are available, let the employee choose.
      const row = classStockRowForItem(itemName);
      const repairedQty = row ? Math.max(0, Number(row.repairedBin) || 0) : 0;
      const classQty = row ? Math.max(0, Number(row.classStock) || 0) : 0;
      let visibleSources = ['Repaired Bin', 'Class Stock'];

      if (repairedQty > 0 && classQty <= 0) visibleSources = ['Repaired Bin'];
      else if (classQty > 0 && repairedQty <= 0) visibleSources = ['Class Stock'];

      filterLocationTiles(from, function(value) {
        return visibleSources.includes(value);
      });

      const preferred = preferredSource && visibleSources.includes(preferredSource)
        ? preferredSource
        : null;

      if (preferred) {
        from.value = preferred;
      } else if (visibleSources.length === 1) {
        from.value = visibleSources[0];
      } else {
        from.selectedIndex = -1;
      }

      if (sourceLabel) sourceLabel.textContent = 'Replacement source';
      if (destinationLabel) destinationLabel.textContent = 'Replaced in';
      syncChoiceTiles(from);
    }
    let currentSelectedBin = 'ALL';
    let invCache = {};

    // Tile controls retain the original selects as hidden value stores.
    function vanKey(value) {
      const match = String(value).match(/2015|2021|2026/);
      return match ? match[0] : '';
    }
    function selectEmployeeTile(button, employeeName) {
      document.getElementById('employee').value = employeeName;
      document.querySelectorAll('.employee-tile').forEach(function(tile) {
        const selected = tile === button;
        tile.className = 'employee-tile choice-tile';
        tile.setAttribute('aria-pressed', String(selected));
      });
    }
    function syncChoiceTiles(select) {
      const grid = document.getElementById(select.id + 'TileGrid');
      if (!grid) return;
      Array.from(grid.children).forEach(function(button, index) {
        button.disabled = select.disabled || select.options[index].disabled;
        button.setAttribute('aria-pressed', String(index === select.selectedIndex));
      });
    }
    function filterLocationTiles(select, allowed) {
      const grid = document.getElementById(select.id + 'TileGrid');
      Array.from(select.options).forEach(function(option, index) {
        const visible = allowed(option.value);
        option.disabled = !visible;
        const button = grid.children[index];
        button.hidden = !visible;
        button.style.display = visible ? '' : 'none';
      });
      if (select.selectedIndex < 0 || select.options[select.selectedIndex].disabled) {
        const firstAvailable = Array.from(select.options).find(function(option) { return !option.disabled; });
        if (firstAvailable) select.value = firstAvailable.value;
      }
    }
    function onOtherEventChange(eventName) {
      const from = document.getElementById('otherMovedFrom');
      const to = document.getElementById('otherMovedTo');
      const regularLocation = function(value) {
        return Boolean(vanKey(value)) || ['Broken Bin', 'Repaired Bin', 'Class Stock'].includes(value);
      };
      if (eventName === 'Found') {
        filterLocationTiles(from, function(value) { return value === 'Missing'; });
        filterLocationTiles(to, regularLocation);
        from.value = 'Missing';
      } else if (eventName === 'Disposed of') {
        filterLocationTiles(from, regularLocation);
        filterLocationTiles(to, function(value) { return value === ''; });
        to.value = '';
      } else if (eventName === 'Added/Purchased') {
        filterLocationTiles(from, function(value) { return value === ''; });
        filterLocationTiles(to, function(value) {
          return Boolean(vanKey(value)) || ['Tool Room', 'Class Stock', 'E-commerce Stock'].includes(value);
        });
        from.value = '';
        to.value = 'Tool Room';
      } else if (eventName === 'Repaired') {
        filterLocationTiles(from, function(value) { return value === 'Broken Bin'; });
        filterLocationTiles(to, regularLocation);
        from.value = 'Broken Bin';
      } else if (eventName === 'Moved') {
        // Generic/exception movement: intentionally expose the broad location set.
        filterLocationTiles(from, function(value) {
          return value === 'Tool Room' || value === 'Missing' || value === 'E-commerce Stock' || regularLocation(value);
        });
        filterLocationTiles(to, function(value) {
          return value === 'Tool Room' || value === 'E-commerce Stock' || regularLocation(value);
        });
      }
      // Hide the fixed, automatically selected source/destination controls.
      from.parentElement.hidden = eventName === 'Found' || eventName === 'Added/Purchased';
      from.parentElement.style.display = from.parentElement.hidden ? 'none' : '';
      to.parentElement.hidden = eventName === 'Disposed of';
      to.parentElement.style.display = to.parentElement.hidden ? 'none' : '';
      syncChoiceTiles(from);
      syncChoiceTiles(to);
    }
    function initializeChoiceTiles() {
      // Employee, event, and van/location choices intentionally start blank.
      ['whichVanRestocked', 'vanOrLocationBroke', 'needsReplacementLocation'].forEach(function(id) {
        const select = document.getElementById(id);
        if (select) select.selectedIndex = -1;
      });
      document.querySelectorAll('#logForm select').forEach(function(select) {
        const grid = document.createElement('div');
        grid.id = select.id + 'TileGrid';
        grid.className = 'choice-grid';
        if (['whichVanRestocked', 'vanOrLocationBroke', 'needsReplacementLocation'].includes(select.id)) {
          grid.classList.add('choice-grid-3');
        }
        if (select.id === 'didYouReplace' || select.id === 'needsReplacementStatus') {
          grid.classList.add('replace-choice-grid');
        }
        if (select.id === 'transferMovedFrom') {
          grid.classList.add('replace-source-grid');
        }
        if (select.id === 'transferMovedTo') {
          grid.classList.add('choice-grid-3');
        }
        if (select.id === 'otherEventSub') {
          grid.classList.add('other-event-grid');
        }
        grid.setAttribute('role', 'group');
        const label = select.parentElement.querySelector('label');
        if (label) grid.setAttribute('aria-label', label.textContent.trim());
        Array.from(select.options).forEach(function(option, index) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'choice-tile';
          button.textContent = option.textContent;
          const van = vanKey(option.value);
          if (van) button.dataset.van = van;
          button.addEventListener('click', function() {
            select.selectedIndex = index;
            select.dispatchEvent(new Event('change', { bubbles:true }));
            syncChoiceTiles(select);
          });
          grid.appendChild(button);
        });
        select.hidden = true;
        select.style.display = 'none';
        select.insertAdjacentElement('afterend', grid);
        select.addEventListener('change', function() { syncChoiceTiles(select); });
        syncChoiceTiles(select);
      });
      const employee = document.getElementById('employee').value;
      document.querySelectorAll('.employee-tile').forEach(function(button) {
        button.className = 'employee-tile choice-tile';
        button.setAttribute('aria-pressed', String(button.textContent.trim() === employee));
      });
      ['2015','2021','2026'].forEach(function(year) {
        const tab = document.getElementById('invTab' + year);
        tab.dataset.van = year;
        tab.setAttribute('aria-pressed', String(year === currentInvTab));
      });
      document.querySelectorAll('#logForm label').forEach(function(label) {
        const year = vanKey(label.textContent);
        if (year) { label.dataset.van = year; label.classList.add('van-reference'); }
      });
    }
    initializeChoiceTiles();
    onOtherEventChange(document.getElementById('otherEventSub').value);
    onNeedsReplacementChange(document.getElementById('needsReplacementStatus').value);

    window.onload = async function() {
      // Start offline/PWA setup in parallel. Never make live inventory wait for it.
      waInitPwa().catch(function(err) {
        console.warn('PWA initialization issue:', err);
      });

      try {
        const results = await Promise.all([
          apiGetToolItems(),
          apiGetInventory('class')
        ]);
        allItems = results[0];
        invCache['class'] = results[1];
        updateClassStockToolNames(results[1]);
      } catch (err) {
        console.error(err);
        try {
          allItems = await apiGetToolItems();
        } catch (toolErr) {
          console.error(toolErr);
          allItems = [];
        }
        try {
          const classRows = await apiGetInventory('class');
          invCache['class'] = classRows;
          updateClassStockToolNames(classRows);
        } catch (classErr) {
          console.error(classErr);
        }
      }
    };
    // MODE SWITCHER (LOG vs INVENTORY)
    function switchTopMode(mode) {
      currentTopMode = mode;
      document.body.classList.toggle('log-mode', mode === 'log');
      const logCont = document.getElementById('logContainer');
      const invCont = document.getElementById('inventoryContainer');
      const btnLog = document.getElementById('modeBtnLog');
      const btnInv = document.getElementById('modeBtnInv');
      if (mode === 'log') {
        logCont.classList.remove('hidden');
        invCont.classList.add('hidden');
        btnLog.className = 'py-2 rounded-lg text-center bg-white text-indigo-700 shadow-sm transition-all';
        btnInv.className = 'py-2 rounded-lg text-center text-indigo-100 hover:text-white transition-all';
      } else {
        logCont.classList.add('hidden');
        invCont.classList.remove('hidden');
        btnInv.className = 'py-2 rounded-lg text-center bg-white text-indigo-700 shadow-sm transition-all';
        btnLog.className = 'py-2 rounded-lg text-center text-indigo-100 hover:text-white transition-all';
        loadInventoryTab(currentInvTab);
      }
    }
    // INVENTORY TABS
    function loadInventoryTab(tabKey) {
      currentInvTab = tabKey;
      currentSelectedBin = 'ALL';
      document.getElementById('invLoading').classList.add('hidden');
      document.getElementById('activeBinHeader').classList.add('hidden');
      document.querySelectorAll('.inv-tab-btn').forEach(btn => {
        btn.className = 'inv-tab-btn shrink-0 px-3 py-2 rounded-xl bg-white text-slate-700 border border-slate-200';
        btn.setAttribute('aria-pressed', 'false');
      });
      const activeBtn = document.getElementById('invTab' + (tabKey.charAt(0).toUpperCase() + tabKey.slice(1)));
      if (activeBtn) {
        activeBtn.setAttribute('aria-pressed', 'true');
        activeBtn.className = 'inv-tab-btn shrink-0 px-3 py-2 rounded-xl bg-indigo-600 text-white shadow-xs font-bold';
      }
      if (tabKey === 'attention') {
        loadAllAttentionInventory();
        return;
      }
      if (invCache[tabKey]) {
        renderBinTiles();
        renderFilteredInventory();
        refreshInventorySilently(tabKey);
      } else {
        fetchInventoryFromSheet(tabKey);
      }
    }

    function loadAllAttentionInventory() {
      const tabs = ['2015', '2021', '2026'];
      const loader = document.getElementById('invLoading');
      const haveAll = tabs.every(function(tab) { return Array.isArray(invCache[tab]); });
      if (haveAll) {
        loader.classList.add('hidden');
        renderBinTiles();
        renderFilteredInventory();
        tabs.forEach(function(tab) { refreshInventorySilently(tab); });
        return;
      }
      document.getElementById('baselineAlerts').classList.add('hidden');
      document.getElementById('invCardsList').classList.add('hidden');
      document.getElementById('inventorySearchSection').classList.add('hidden');
      document.getElementById('binTilesSection').classList.add('hidden');
      document.getElementById('activeBinHeader').classList.add('hidden');
      loader.classList.remove('hidden');
      Promise.all(tabs.map(function(tab) {
        return apiGetInventory(tab).then(function(rows) { invCache[tab] = rows; });
      })).then(function() {
        loader.classList.add('hidden');
        if (currentInvTab === 'attention') {
          renderBinTiles();
          renderFilteredInventory();
        }
      }).catch(function(err) {
        loader.classList.add('hidden');
        const list = document.getElementById('invCardsList');
        list.classList.remove('hidden');
        list.innerHTML = '<div class="p-4 bg-red-50 text-red-600 text-xs rounded-xl text-center">Failed to load all vans: ' + err.message + '</div>';
      });
    }
    function refreshInventorySilently(tabKey) {
      if (navigator.onLine === false) return;
      apiGetInventory(tabKey)
        .then(function(res) {
          invCache[tabKey] = res;
          if (tabKey === 'class') updateClassStockToolNames(res);
          if (currentTopMode === 'inventory' && (currentInvTab === tabKey || currentInvTab === 'attention')) {
            renderBinTiles();
            renderFilteredInventory();
          }
        })
        .catch(function(err) {
          console.warn('Background inventory refresh failed:', err);
        });
    }
    function refreshActiveView() {
      if (currentTopMode === 'inventory') {
        if (currentInvTab === 'attention') {
          ['2015', '2021', '2026'].forEach(function(tab) { delete invCache[tab]; });
          loadAllAttentionInventory();
        } else {
          delete invCache[currentInvTab];
          fetchInventoryFromSheet(currentInvTab);
        }
      } else {
        apiGetToolItems()
          .then(function(items) { allItems = items; })
          .catch(function(err) { console.error(err); });
      }
    }
    function fetchInventoryFromSheet(tabKey) {
      const loader = document.getElementById('invLoading');
      const list = document.getElementById('invCardsList');
      const binSec = document.getElementById('binTilesSection');
      document.getElementById('baselineAlerts').classList.add('hidden');
      loader.classList.remove('hidden');
      list.innerHTML = '';
      binSec.classList.add('hidden');
      apiGetInventory(tabKey)
        .then(function(res) {
          loader.classList.add('hidden');
          invCache[tabKey] = res;
          if (tabKey === 'class') updateClassStockToolNames(res);
          if (currentInvTab === tabKey) {
            renderBinTiles();
            renderFilteredInventory();
          }
        })
        .catch(function(err) {
          loader.classList.add('hidden');
          list.innerHTML = '<div class="p-4 bg-red-50 text-red-600 text-xs rounded-xl text-center">Failed to load: ' + err.message + '</div>';
        });
    }
    function selectBinFilter(binName) {
      currentSelectedBin = (currentSelectedBin === binName && binName !== 'ALL') ? 'ALL' : binName;
      renderBinTiles();
      renderFilteredInventory();
    }
    // RENDER BIN TILES GROUPED BY STORAGE AREA (IN SHEET ROW ORDER)
    function renderBinTiles() {
      const binSec = document.getElementById('binTilesSection');
      const groupsContainer = document.getElementById('binTilesGroups');
      const activeHeader = document.getElementById('activeBinHeader');
      const activeLabel = document.getElementById('activeBinLabel');
      const isVanTab = (currentInvTab === '2026' || currentInvTab === '2021' || currentInvTab === '2015');
      if (!isVanTab) {
        binSec.classList.add('hidden');
        activeHeader.classList.add('hidden');
        return;
      }
      const data = invCache[currentInvTab] || [];
      if (data.length === 0) {
        binSec.classList.add('hidden');
        activeHeader.classList.add('hidden');
        return;
      }
      // Group bins by Storage Area preserving original sequential encounter order
      const areasOrdered = [];
      const areasMap = {};
      data.forEach(item => {
        const areaName = (item.area || 'General Storage').trim();
        const binName = (item.bin || 'General Bin').trim();
        if (!areasMap[areaName]) {
          areasMap[areaName] = {
            area: areaName,
            binsOrdered: [],
            binsMap: {}
          };
          areasOrdered.push(areasMap[areaName]);
        }
        const aObj = areasMap[areaName];
        if (!aObj.binsMap[binName]) {
          const bObj = { bin: binName, count: 0 };
          aObj.binsMap[binName] = bObj;
          aObj.binsOrdered.push(bObj);
        }
        aObj.binsMap[binName].count++;
      });
      activeHeader.dataset.van = currentInvTab;
      document.getElementById('btnBinAll').dataset.van = currentInvTab;
      groupsContainer.innerHTML = '';
      areasOrdered.forEach(areaObj => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'space-y-1.5 bg-slate-50/70 p-2.5 rounded-2xl border border-slate-200/80';
        groupDiv.classList.add('van-storage-group');
        groupDiv.dataset.van = currentInvTab;
        // Area Section Header
        const header = document.createElement('div');
        header.className = 'flex items-center space-x-1.5 px-0.5 text-[11px] font-bold text-slate-600 uppercase tracking-wider';
        header.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
          <span>${escapeLocationHtml(formatLocation(areaObj.area, ''))}</span>
        `;
        groupDiv.appendChild(header);
        // Bins Grid for this Area
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 gap-1.5';
        areaObj.binsOrdered.forEach(bInfo => {
          const isSelected = (currentSelectedBin === bInfo.bin);
          const tile = document.createElement('button');
          tile.type = 'button';
          tile.onclick = function() { selectBinFilter(bInfo.bin); };
          tile.className = isSelected
            ? 'p-2.5 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-900 font-bold shadow-xs text-left transition-all flex flex-col justify-between'
            : 'p-2.5 rounded-xl border border-slate-200 bg-white text-slate-800 hover:border-indigo-300 shadow-2xs text-left transition-all flex flex-col justify-between';
          tile.classList.add('van-bin-tile');
          tile.dataset.van = currentInvTab;
          tile.setAttribute('aria-pressed', String(isSelected));
          tile.innerHTML = `
            <div class="flex items-start justify-between w-full">
              <span class="text-xs font-bold leading-tight line-clamp-2">${bInfo.bin}</span>
              <span data-bin-count class="${isSelected ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600'} text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1 shrink-0">
                ${bInfo.count}
              </span>
            </div>
          `;
          grid.appendChild(tile);
        });
        groupDiv.appendChild(grid);
        groupsContainer.appendChild(groupDiv);
      });
      binSec.classList.remove('hidden');
      if (currentSelectedBin !== 'ALL') {
        activeLabel.textContent = 'Bin: ' + currentSelectedBin;
        activeHeader.classList.remove('hidden');
      } else {
        activeHeader.classList.add('hidden');
      }
    }
    function clearInvSearch() {
      document.getElementById('invSearch').value = '';
      document.getElementById('clearInvSearchBtn').classList.add('hidden');
      renderFilteredInventory();
    }
    // Present named bins before physical storage positions; retain original sheet values.
    function locationDisplayParts(area, bin) {
      const areaText = String(area || '').trim();
      const binText = String(bin || '').trim();
      const separator = areaText.indexOf(' - ');
      if (separator >= 0) {
        return [areaText.slice(separator + 3), binText, areaText.slice(0, separator)].filter(Boolean);
      }
      return [binText, areaText].filter(Boolean);
    }
    function formatLocation(area, bin) {
      return locationDisplayParts(area, bin).join(' • ');
    }
    function escapeLocationHtml(text) {
      const span = document.createElement('span');
      span.textContent = text;
      return span.innerHTML;
    }
    function getBaselineDiscrepancies(data) {
      return data.map(function(item) {
        const current = Number(item.quantity);
        const baseline = Number(item.baseline);
        return { item: item, current: current, baseline: baseline, difference: current - baseline };
      }).filter(function(entry) {
        return Number.isFinite(entry.current) && Number.isFinite(entry.baseline) && entry.difference !== 0;
      }).sort(function(a, b) {
        return (a.difference < 0 ? 0 : 1) - (b.difference < 0 ? 0 : 1);
      });
    }
    function replacementDestinationForAlert(entry) {
      const van = String(entry.van || currentInvTab);
      if (van === '2015') return '2015 Van';
      if (van === '2021') return '2021 Van';
      if (van !== '2026') return '';
      const locationText = ((entry.item.area || '') + ' ' + (entry.item.bin || '')).toLowerCase();
      if (locationText.includes('floor') || locationText.includes('bottom')) return '2026 Van Floor Level';
      if (locationText.includes('2nd') || locationText.includes('second') || locationText.includes('middle')) return '2026 Van 2nd Level';
      return '2026 Van Other';
    }
    function vanDisplayName(van) {
      return String(van) + ' Van';
    }
    function setChoiceValue(selectId, value) {
      const select = document.getElementById(selectId);
      if (!select) return;
      select.value = value;
      select.dispatchEvent(new Event('change', { bubbles:true }));
      syncChoiceTiles(select);
    }
    function clearEmployeeForQuickFill() {
      document.getElementById('employee').value = '';
      document.querySelectorAll('.employee-tile').forEach(function(button) {
        button.className = 'employee-tile choice-tile';
        button.setAttribute('aria-pressed', 'false');
      });
    }
    function prepareReplacementFromAlert(entry, source, quantity) {
      const destination = replacementDestinationForAlert(entry);
      const statusItem = isReplenishmentStatusItem(entry.item.item);
      const qty = statusItem ? 1 : Math.max(1, Math.min(Number(quantity) || 1, Math.max(1, -entry.difference)));
      document.getElementById('itemSearch').value = entry.item.item;
      document.getElementById('clearBtn').classList.remove('hidden');
      document.getElementById('quantity').value = String(qty);
      document.getElementById('notes').value = '';
      document.getElementById('successBox').classList.add('hidden');
      selectActionTab('Restock / Replace');
      configureRestockReplaceForItem(source);
      setChoiceValue('transferMovedFrom', source);
      setChoiceValue('transferMovedTo', destination);
      clearEmployeeForQuickFill();
      const notice = document.getElementById('quickFillNotice');
      const noticeText = document.getElementById('quickFillNoticeText');
      let actionWord = 'Replacement';
      if (source === 'Tool Room') actionWord = statusItem ? 'Replenishment / recharge' : 'Restock';
      noticeText.textContent = actionWord + ' ready: ' + entry.item.item + ' × ' + qty
        + ' • ' + source + ' → ' + destination + '. Select your name and submit.';
      notice.classList.remove('hidden');
      switchTopMode('log');
      requestAnimationFrame(function() { window.scrollTo(0, 0); });
    }
    function prepareFoundFromAlert(entry, quantity) {
      const destination = replacementDestinationForAlert(entry);
      const qty = isReplenishmentStatusItem(entry.item.item)
        ? 1
        : Math.max(1, Math.min(Number(quantity) || 1, Math.max(1, -entry.difference)));
      document.getElementById('itemSearch').value = entry.item.item;
      document.getElementById('clearBtn').classList.remove('hidden');
      document.getElementById('quantity').value = String(qty);
      document.getElementById('notes').value = '';
      document.getElementById('successBox').classList.add('hidden');
      selectActionTab('Other Event (Found, Disposed, Purchased, Sold)');
      setChoiceValue('otherEventSub', 'Found');
      setChoiceValue('otherMovedTo', destination);
      clearEmployeeForQuickFill();
      const notice = document.getElementById('quickFillNotice');
      const noticeText = document.getElementById('quickFillNoticeText');
      noticeText.textContent = 'Found ready: ' + entry.item.item + ' × ' + qty
        + ' • Missing → ' + destination + '. Select your name and submit.';
      notice.classList.remove('hidden');
      switchTopMode('log');
      requestAnimationFrame(function() { window.scrollTo(0, 0); });
    }
    function buildAlertActionRow(entry, buttonText, clickHandler) {
      const needed = Math.max(1, -entry.difference);
      const statusItem = isReplenishmentStatusItem(entry.item.item);
      const row = document.createElement('div');
      row.className = 'attention-action-row';
      const stepper = document.createElement('div');
      stepper.className = 'attention-mini-stepper';
      const minus = document.createElement('button');
      minus.type = 'button';
      minus.className = 'attention-mini-qty-btn';
      minus.textContent = '−';
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.max = String(statusItem ? 1 : needed);
      input.value = '0';
      input.className = 'attention-mini-qty-input';
      input.setAttribute('aria-label', buttonText + ' quantity for ' + entry.item.item);
      const plus = document.createElement('button');
      plus.type = 'button';
      plus.className = 'attention-mini-qty-btn';
      plus.textContent = '+';
      function setClamped(value) {
        const max = statusItem ? 1 : needed;
        const next = Math.max(0, Math.min(max, Number(value) || 0));
        input.value = String(next);
        return next;
      }
      if (statusItem) {
        minus.disabled = true;
        plus.disabled = true;
      } else {
        minus.addEventListener('click', function() { setClamped(Number(input.value) - 1); });
        plus.addEventListener('click', function() { setClamped(Number(input.value) + 1); });
      }
      input.addEventListener('change', function() { setClamped(input.value); });
      stepper.append(minus, input, plus);
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'attention-action-button';
      button.textContent = buttonText;
      button.addEventListener('click', function() {
        const qty = setClamped(input.value);
        if (qty <= 0) {
          alert('Select a quantity first.');
          return;
        }
        clickHandler(qty);
      });
      row.append(stepper, button);
      return row;
    }
    function buildAlertActionButtonOnly(buttonText, clickHandler) {
      const row = document.createElement('div');
      row.className = 'attention-action-row attention-action-row-single';

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'attention-action-button attention-action-button-full';
      button.textContent = buttonText;
      button.addEventListener('click', clickHandler);

      row.appendChild(button);
      return row;
    }

    function buildReplacementShortcutControls(entry) {
      const wrap = document.createElement('div');
      wrap.className = 'replacement-shortcut attention-actions';

      const heading = document.createElement('div');
      heading.className = 'replacement-shortcut-title';
      heading.textContent = 'Resolve shortage';
      wrap.appendChild(heading);

      const itemName = entry.item.item;

      // Replenishment-status supplies are simple 1/0 status items.
      // They only need one action and no quantity picker.
      if (isReplenishmentStatusItem(itemName)) {
        wrap.appendChild(buildAlertActionButtonOnly('Replenished', function() {
          prepareReplacementFromAlert(entry, 'Tool Room', 1);
        }));
        return wrap;
      }

      // Items carried in Class Stock can be resolved in only these three ways.
      if (isClassStockTool(itemName)) {
        wrap.appendChild(buildAlertActionRow(entry, 'Replaced from Repaired Bin', function(qty) {
          prepareReplacementFromAlert(entry, 'Repaired Bin', qty);
        }));
        wrap.appendChild(buildAlertActionRow(entry, 'Replaced from Class Stock', function(qty) {
          prepareReplacementFromAlert(entry, 'Class Stock', qty);
        }));
        wrap.appendChild(buildAlertActionRow(entry, 'Found', function(qty) {
          prepareFoundFromAlert(entry, qty);
        }));
        return wrap;
      }

      // Everything else is a Misc item. Misc shortages are resolved only by
      // restocking from the Tool Room.
      wrap.appendChild(buildAlertActionRow(entry, 'Restocked from Tool Room', function(qty) {
        prepareReplacementFromAlert(entry, 'Tool Room', qty);
      }));
      return wrap;
    }

    function buildBaselineAlertCard(entry, van, compact) {
      const card = document.createElement('div');
      card.className = compact ? 'attention-card attention-card-compact' : 'attention-card';
      card.dataset.van = van;
      const top = document.createElement('div');
      top.className = 'attention-card-top';
      const titleWrap = document.createElement('div');
      titleWrap.className = 'min-w-0';
      const title = document.createElement('h3');
      title.className = 'attention-tool-name';
      title.textContent = entry.item.item;
      titleWrap.appendChild(title);
      const location = document.createElement('p');
      location.className = 'attention-location';
      location.textContent = formatLocation(entry.item.area, entry.item.bin) || 'Location unspecified';
      titleWrap.appendChild(location);
      const vanBadge = document.createElement('span');
      vanBadge.className = 'attention-van-badge';
      vanBadge.textContent = vanDisplayName(van);
      top.append(titleWrap, vanBadge);
      card.appendChild(top);
      const meta = document.createElement('div');
      meta.className = 'attention-meta-line';
      const current = document.createElement('span');
      current.innerHTML = 'Current <strong>' + entry.current + '</strong>';
      const baseline = document.createElement('span');
      baseline.innerHTML = 'Baseline <strong>' + entry.baseline + '</strong>';
      const status = document.createElement('span');
      status.className = entry.difference < 0 ? 'attention-status-short' : 'attention-status-high';
      status.textContent = entry.difference < 0
        ? (isReplenishmentStatusItem(entry.item.item) ? 'Needs replenishing / recharging' : (-entry.difference) + ' needed')
        : '+' + entry.difference + ' above baseline';
      meta.append(current, baseline, status);
      card.appendChild(meta);
      const note = document.createElement('p');
      note.className = 'attention-note';
      note.textContent = 'Notes: ' + (String(entry.item.notes || '').trim() || 'None');
      card.appendChild(note);
      if (entry.difference < 0) {
        const actionEntry = Object.assign({}, entry, { van: van });
        card.appendChild(buildReplacementShortcutControls(actionEntry));
      }
      return card;
    }
    function renderBaselineAlerts() {
      const section = document.getElementById('baselineAlerts');
      const list = document.getElementById('baselineAlertsList');
      list.replaceChildren();
      section.classList.remove('all-vans-attention');
      let entries = [];
      let compact = false;
      if (currentInvTab === 'attention') {
        compact = true;
        section.classList.add('all-vans-attention');
        ['2026', '2021', '2015'].forEach(function(van) {
          const rows = invCache[van];
          if (!Array.isArray(rows)) return;
          getBaselineDiscrepancies(rows).forEach(function(entry) {
            entries.push(Object.assign({}, entry, { van: van }));
          });
        });
      } else if (['2015', '2021', '2026'].includes(currentInvTab) && invCache[currentInvTab]) {
        entries = getBaselineDiscrepancies(invCache[currentInvTab]).map(function(entry) {
          return Object.assign({}, entry, { van: currentInvTab });
        });
      } else {
        section.classList.add('hidden');
        return;
      }
      if (!entries.length) {
        if (currentInvTab === 'attention') {
          document.getElementById('baselineAlertsTitle').textContent = '✅ All vans — nothing needs attention';
          document.getElementById('baselineAlertsSummary').textContent = 'All tracked van quantities are at baseline.';
          section.classList.remove('hidden');
        } else {
          section.classList.add('hidden');
        }
        return;
      }
      const order = { '2026': 0, '2021': 1, '2015': 2 };
      entries.sort(function(a, b) {
        const shortageOrder = (a.difference < 0 ? 0 : 1) - (b.difference < 0 ? 0 : 1);
        if (shortageOrder) return shortageOrder;
        return (order[a.van] || 0) - (order[b.van] || 0);
      });
      const shortages = entries.filter(function(entry) { return entry.difference < 0; });
      const needed = shortages.reduce(function(total, entry) { return total - entry.difference; }, 0);
      const excess = entries.length - shortages.length;
      document.getElementById('baselineAlertsTitle').textContent = currentInvTab === 'attention'
        ? '⚠️ All Vans — Inventory needs attention'
        : '⚠️ ' + currentInvTab + ' Van — Inventory needs attention';
      document.getElementById('baselineAlertsSummary').textContent = shortages.length + ' shortage entries · ' + needed + ' units needed'
        + (excess ? ' · ' + excess + ' above-baseline entries' : '');
      entries.forEach(function(entry) {
        list.appendChild(buildBaselineAlertCard(entry, entry.van, compact));
      });
      section.classList.remove('hidden');
    }
    function renderFilteredInventory() {
      const searchSection = document.getElementById('inventorySearchSection');
      const list = document.getElementById('invCardsList');
      if (currentInvTab === 'attention') {
        searchSection.classList.add('hidden');
        document.getElementById('binTilesSection').classList.add('hidden');
        document.getElementById('activeBinHeader').classList.add('hidden');
        list.classList.add('hidden');
        renderBaselineAlerts();
        return;
      }
      searchSection.classList.remove('hidden');
      list.classList.remove('hidden');
      renderBaselineAlerts();
      const searchInput = document.getElementById('invSearch');
      const clearBtn = document.getElementById('clearInvSearchBtn');
      const query = (searchInput.value || '').toLowerCase().trim();
      const data = invCache[currentInvTab] || [];
      if (query.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      list.innerHTML = '';
      if (data.length === 0) {
        list.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">No items found in this sheet.</div>';
        return;
      }
      const filtered = data.filter(row => {
        if (currentSelectedBin !== 'ALL' && row.bin !== currentSelectedBin) {
          return false;
        }
        if (query) {
          const text = Object.values(row).join(' ').toLowerCase();
          return text.includes(query);
        }
        return true;
      });
      if (filtered.length === 0) {
        list.innerHTML = '<div class="p-8 text-center text-slate-400 text-xs">No matching tools found in this bin.</div>';
        return;
      }
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-white rounded-xl border border-slate-200 p-3 shadow-2xs space-y-1';
        if (currentInvTab === 'summary') {
          card.innerHTML = `
            <div>
              <h3 class="text-xs font-bold text-slate-900">${item.item}</h3>
            </div>
            <div class="grid grid-cols-3 gap-1 pt-1.5 text-[11px] text-slate-600 text-center">
              <div class="bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                <span data-van="2015" class="van-reference text-[10px] block font-medium">2015 Van</span>
                <span class="font-bold text-slate-800">${item.van2015 ?? 0}</span>
              </div>
              <div class="bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                <span data-van="2021" class="van-reference text-[10px] block font-medium">2021 Van</span>
                <span class="font-bold text-slate-800">${item.van2021 ?? 0}</span>
              </div>
              <div class="bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                <span data-van="2026" class="van-reference text-[10px] block font-medium">2026 Van</span>
                <span class="font-bold text-slate-800">${item.van2026 ?? 0}</span>
              </div>
            </div>
            <div class="text-[10px] pt-1 text-slate-500">
              Class Stock: <strong class="text-indigo-700">${item.classStock ?? 0}</strong> •
              Broken: <strong class="text-red-600">${item.broken ?? 0}</strong> •
              Repaired: <strong class="text-emerald-600">${item.repaired ?? 0}</strong> •
              Missing: <strong class="text-amber-600">${item.missing ?? 0}</strong>
            </div>
          `;
        } else if (currentInvTab === 'class') {
          card.innerHTML = `
            <div class="flex items-start justify-between">
              <h3 class="text-xs font-bold text-slate-900">${item.tool}</h3>
            </div>
            <div class="pt-1 text-xs" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;">
              <div class="bg-indigo-100 text-indigo-800 p-2 rounded-lg border border-indigo-200">
                <span class="text-[10px] text-indigo-600 block">Class Stock</span>
                <span class="text-base font-bold">${item.classStock ?? 0}</span>
              </div>
              <div class="bg-red-50 text-red-800 p-2 rounded-lg border border-red-200">
                <span class="text-[10px] text-red-500 block">Broken Bin</span>
                <span class="text-base font-bold">${item.brokenBin ?? 0}</span>
              </div>
              <div class="bg-emerald-50 text-emerald-800 p-2 rounded-lg border border-emerald-200">
                <span class="text-[10px] text-emerald-500 block">Repaired Bin</span>
                <span class="text-base font-bold">${item.repairedBin ?? 0}</span>
              </div>
              <div class="bg-amber-50 text-amber-800 p-2 rounded-lg border border-amber-200">
                <span class="text-[10px] text-amber-600 block">Missing</span>
                <span class="text-base font-bold">${item.missing ?? 0}</span>
              </div>
            </div>
          `;
        } else {
          const isAtBaseline = Number(item.quantity) >= Number(item.baseline);
          const noteText = String(item.notes ?? '').trim();
          const hasNote = noteText.length > 0;
          card.innerHTML = `
            <div class="flex items-start justify-between">
              <div>
                <h3 class="text-xs font-bold text-slate-900">${item.item}</h3>
                <p class="text-[10px] text-slate-400">${escapeLocationHtml(formatLocation(item.area, item.bin))}</p>
              </div>
              <div class="text-right">
                <span class="inline-block px-2 py-0.5 rounded text-xs font-extrabold ${isAtBaseline ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}">
                  ${item.quantity ?? '-'} <span class="text-[10px] font-normal text-slate-400">/ ${item.baseline ?? '-'}</span>
                </span>
              </div>
            </div>
            ${hasNote ? `
              <div class="mt-1 pt-1 border-t border-slate-100 flex items-center space-x-1 text-[11px] text-slate-700">
                <span class="text-indigo-600 font-semibold">Note:</span>
                <span class="bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200/60 text-slate-800">${escapeLocationHtml(noteText)}</span>
              </div>
            ` : ''}
          `;
        }
        list.appendChild(card);
      });
    }
    // LOGGER AUTOCOMPLETE & SUBMIT LOGIC
    function onSearchInput(val) {
      // Reconfigure labels/source behavior from exact item matches.
      setTimeout(function() { configureSelectedItemMode(); }, 0);
      const list = document.getElementById('autocompleteList');
      const clearBtn = document.getElementById('clearBtn');
      list.innerHTML = '';
      if (!val || val.trim().length === 0) {
        list.classList.add('hidden');
        clearBtn.classList.add('hidden');
        return;
      }
      clearBtn.classList.remove('hidden');
      const query = val.toLowerCase().trim();
      const matches = allItems.filter(item => item.toLowerCase().includes(query)).slice(0, 15);
      if (matches.length === 0) {
        list.innerHTML = '<div class="p-3 text-xs text-slate-400 text-center">No matching tools</div>';
        list.classList.remove('hidden');
        return;
      }
      matches.forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'p-3 text-sm cursor-pointer hover:bg-indigo-50 font-medium text-slate-800';
        itemDiv.textContent = item;
        itemDiv.onclick = function() {
          document.getElementById('itemSearch').value = item;
          list.classList.add('hidden');
          configureSelectedItemMode();
        };
        list.appendChild(itemDiv);
      });
      list.classList.remove('hidden');
    }
    function clearItemSearch() {
      document.getElementById('itemSearch').value = '';
      document.getElementById('autocompleteList').classList.add('hidden');
      document.getElementById('clearBtn').classList.add('hidden');
      configureSelectedItemMode();
    }
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#itemSearch') && !e.target.closest('#autocompleteList')) {
        document.getElementById('autocompleteList').classList.add('hidden');
      }
    });
    function selectActionTab(actionName) {
      currentAction = actionName;
      document.querySelectorAll('.action-tab').forEach(tab => {
        tab.className = 'action-tab p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 flex flex-col justify-between hover:bg-slate-100 font-semibold text-left min-h-[66px]';
      });
      let activeTabId = null;
      if (actionName === 'Broke, Needs replacement') activeTabId = 'tabBroke';
      else if (actionName === 'Missing, Needs replacement') activeTabId = 'tabMissing';
      else if (actionName === 'Needs replacement') activeTabId = 'tabNeedsReplacement';
      else if (actionName === 'Restock / Replace') activeTabId = 'tabRestockReplace';
      else if (actionName === 'Other Event (Found, Disposed, Purchased, Sold)') activeTabId = 'tabOther';
      const activeBtn = document.getElementById(activeTabId);
      if (activeBtn) {
        activeBtn.className = 'action-tab p-3 rounded-xl border-2 border-indigo-600 bg-indigo-50 text-indigo-700 flex flex-col justify-between shadow-xs font-bold text-left min-h-[66px]';
      }
      document.querySelectorAll('.tab-content').forEach(sec => sec.classList.add('hidden'));
      if (actionName === 'Broke, Needs replacement' || actionName === 'Missing, Needs replacement') {
        document.getElementById('secBrokeMissing').classList.remove('hidden');
      } else if (actionName === 'Needs replacement') {
        document.getElementById('secNeedsReplacement').classList.remove('hidden');
      } else if (actionName === 'Restock / Replace') {
        document.getElementById('secTransfer').classList.remove('hidden');
        configureRestockReplaceForItem();
      } else if (actionName === 'Other Event (Found, Disposed, Purchased, Sold)') {
        document.getElementById('secOther').classList.remove('hidden');
      }
      configureSelectedItemMode();
    }
    function onReplaceChange(val) {
      const splitSec = document.getElementById('secSplitQuantities');
      if (val === 'Yes, split locations/partially replaced') {
        splitSec.classList.remove('hidden');
      } else {
        splitSec.classList.add('hidden');
      }
    }
    function onNeedsReplacementChange(val) {
      const wrap = document.getElementById('needsRestockQtyWrap');
      const statusItem = isReplenishmentStatusItem(document.getElementById('itemSearch').value);
      if (statusItem) {
        document.getElementById('needsRestockQty').value = '1';
        wrap.classList.add('hidden');
        return;
      }
      if (val === 'Restocked from tool room') {
        wrap.classList.remove('hidden');
        const mainQty = Math.max(1, parseInt(document.getElementById('quantity').value, 10) || 1);
        const input = document.getElementById('needsRestockQty');
        if (!input.value || Number(input.value) <= 0) input.value = String(mainQty);
      } else {
        wrap.classList.add('hidden');
      }
    }
    function adjustNeedsRestockQty(delta) {
      const input = document.getElementById('needsRestockQty');
      const maxQty = Math.max(1, parseInt(document.getElementById('quantity').value, 10) || 1);
      let value = parseInt(input.value, 10);
      if (!Number.isFinite(value)) value = maxQty;
      value = Math.max(0, Math.min(maxQty, value + delta));
      input.value = String(value);
    }
    function vanForRestockLocation(location) {
      if (String(location).includes('2015')) return '2015 Van';
      if (String(location).includes('2021')) return '2021 Van';
      if (String(location).includes('2026')) return '2026 Van';
      return '';
    }
    function adjustSplitQty(inputId, delta) {
      const input = document.getElementById(inputId);
      input.value = Math.max(0, (parseInt(input.value, 10) || 0) + delta);
    }
    function adjustQty(delta) {
      const el = document.getElementById('quantity');
      let val = parseInt(el.value, 10) || 1;
      val = Math.max(1, val + delta);
      el.value = val;
    }
    function handleFormSubmit(e) {
      e.preventDefault();
      const employee = document.getElementById('employee').value.trim();
      if (!employee) {
        alert('Please select your name before submitting.');
        document.getElementById('employeeTileGrid').scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      if (!currentAction) {
        alert('Please select an event before submitting.');
        document.getElementById('actionTileGrid').scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      if (currentAction === 'Needs replacement' && !document.getElementById('needsReplacementLocation').value) {
        alert('Please select which van/location needs replacement.');
        document.getElementById('needsReplacementLocationTileGrid').scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      if (currentAction === 'Needs replacement' && isReplenishmentStatusItem(document.getElementById('itemSearch').value)) {
        const statusRow = rowForVanLocation(
          document.getElementById('itemSearch').value,
          document.getElementById('needsReplacementLocation').value
        );
        if (statusRow && Number(statusRow.quantity) <= 0) {
          alert('This item is already marked as needing replenishment in that van/location.');
          return;
        }
      }
      if ((currentAction === 'Broke, Needs replacement' || currentAction === 'Missing, Needs replacement') && !document.getElementById('vanOrLocationBroke').value) {
        alert('Please select which van or location had the tool.');
        document.getElementById('vanOrLocationBrokeTileGrid').scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      if (currentAction === 'Restock / Replace' && (!document.getElementById('transferMovedFrom').value || !document.getElementById('transferMovedTo').value)) {
        alert('Please select the source and van location.');
        document.getElementById('transferMovedFromTileGrid').scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      if (currentAction === 'Restock / Replace' && isReplenishmentStatusItem(document.getElementById('itemSearch').value)) {
        const statusRow = rowForVanLocation(
          document.getElementById('itemSearch').value,
          document.getElementById('transferMovedTo').value
        );
        if (statusRow && Number(statusRow.quantity) >= Number(statusRow.baseline)) {
          alert('This item is already shown as replenished in that van/location.');
          return;
        }
      }
      if (currentAction === 'Other Event (Found, Disposed, Purchased, Sold)' && document.getElementById('otherEventSub').value === 'Moved' && (!document.getElementById('otherMovedFrom').value || !document.getElementById('otherMovedTo').value)) {
        alert('Please select where the item moved from and to.');
        document.getElementById('otherMovedFromTileGrid').scrollIntoView({ behavior:'smooth', block:'center' });
        return;
      }
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Saving to Sheet...</span>';
      const payload = {
        employee: employee,
        item: document.getElementById('itemSearch').value,
        action: currentAction,
        quantity: document.getElementById('quantity').value,
        notes: document.getElementById('notes').value,
        whichVanRestocked: document.getElementById('whichVanRestocked').value,
        needsReplacementLocation: document.getElementById('needsReplacementLocation').value,
        needsReplacementStatus: document.getElementById('needsReplacementStatus').value,
        needsRestockQty: document.getElementById('needsRestockQty').value,
        vanOrLocationBroke: document.getElementById('vanOrLocationBroke').value,
        didYouReplace: document.getElementById('didYouReplace').value,
        qtyRepairedBin: document.getElementById('qtyRepairedBin').value,
        qtyClassStock: document.getElementById('qtyClassStock').value,
        repairedMovedTo: document.getElementById('repairedMovedTo').value,
        transferMovedFrom: document.getElementById('transferMovedFrom').value,
        transferMovedTo: document.getElementById('transferMovedTo').value,
        otherEventSub: document.getElementById('otherEventSub').value,
        otherMovedFrom: document.getElementById('otherMovedFrom').value,
        otherMovedTo: document.getElementById('otherMovedTo').value
      };

      // Keep the existing Apps Script / Google Sheet schema unchanged.
      // Some purpose-built UI events translate into the existing event schema.
      let payloadsToSubmit = [payload];

      if (currentAction === 'Restock / Replace') {
        const statusItem = isReplenishmentStatusItem(payload.item);
        if (statusItem) {
          // Status items use their own clean event type. They do not draw down Tool Room,
          // Class Stock, Misc, or any other tracked quantity.
          payload.action = 'Replenished';
          payload.quantity = 1;
          payload.statusLocation = payload.transferMovedTo;
        } else if (payload.transferMovedFrom === 'Tool Room') {
          payload.action = 'Restocked from tool room';
          payload.whichVanRestocked = vanForRestockLocation(payload.transferMovedTo);
          payload.restockTargetLocation = payload.transferMovedTo;
        } else {
          payload.action = 'Moved/Transferred Stock';
        }
      } else if (currentAction === 'Needs replacement') {
        const statusItem = isReplenishmentStatusItem(payload.item);
        const neededQty = statusItem ? 1 : Math.max(1, Number(payload.quantity) || 1);
        const restockedQty = payload.needsReplacementStatus === 'Restocked from tool room'
          ? (statusItem ? 1 : Math.max(0, Math.min(neededQty, Number(payload.needsRestockQty) || 0)))
          : 0;

        if (statusItem) {
          // Dedicated status events keep the history accurate: no more "Disposed of" workaround.
          payloadsToSubmit = [Object.assign({}, payload, {
            action: 'Needs replenishing / recharging',
            quantity: 1,
            statusLocation: payload.needsReplacementLocation
          })];

          if (restockedQty > 0) {
            payloadsToSubmit.push(Object.assign({}, payload, {
              action: 'Replenished',
              quantity: 1,
              statusLocation: payload.needsReplacementLocation
            }));
          }
        } else {
          // Counted items keep the established replacement behavior.
          const depletion = Object.assign({}, payload, {
            action: 'Other Event (Found, Disposed, Purchased, Sold)',
            quantity: neededQty,
            otherEventSub: 'Disposed of',
            otherMovedFrom: payload.needsReplacementLocation,
            otherMovedTo: '',
            notes: (payload.notes ? payload.notes + ' • ' : '') + 'Needs replacement'
          });

          payloadsToSubmit = [depletion];

          if (restockedQty > 0) {
            payloadsToSubmit.push(Object.assign({}, payload, {
              action: 'Restocked from tool room',
              quantity: restockedQty,
              whichVanRestocked: vanForRestockLocation(payload.needsReplacementLocation),
              restockTargetLocation: payload.needsReplacementLocation,
              notes: (payload.notes ? payload.notes + ' • ' : '') + 'Replacement restock'
            }));
          }
        }
      } else if (currentAction === 'Other Event (Found, Disposed, Purchased, Sold)' && payload.otherEventSub === 'Moved') {
        payload.action = 'Moved/Transferred Stock';
        payload.transferMovedFrom = payload.otherMovedFrom;
        payload.transferMovedTo = payload.otherMovedTo;
      } else if (currentAction === 'Other Event (Found, Disposed, Purchased, Sold)' && payload.otherEventSub === 'Repaired') {
        payload.action = 'Repaired';
        payload.repairedMovedTo = payload.otherMovedTo;
      }

      Promise.all(payloadsToSubmit.map(function(eventPayload) {
        return apiSubmitLog(eventPayload);
      }))
        .then(function(results) {
          const res = results[results.length - 1] || { success:false, error:'No result returned' };
          const allSuccessful = results.every(function(result) { return result && result.success; });
          res.success = allSuccessful;
          res.queued = results.some(function(result) { return result && result.queued; });
          res.syncing = results.some(function(result) { return result && result.syncing; });
          res.item = payload.item;

          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Submit Tool Event</span>';
          if (res.success) {
            document.getElementById('successMsg').textContent = res.queued
              ? (res.syncing
                  ? 'Saved on this device — ' + res.item + ' is syncing.'
                  : 'Saved offline — ' + res.item + ' will sync automatically.')
              : 'Successfully logged ' + res.item + '!';
            document.getElementById('successBox').classList.remove('hidden');
            if (res.queued) {
              // The offline/queued path has already updated IndexedDB. Pull those
              // projected quantities into the live page immediately.
              if (typeof waRefreshVisibleInventoryFromCache === 'function') {
                waRefreshVisibleInventoryFromCache();
              }
            } else {
              // Online save succeeded: discard the in-memory snapshot so the next
              // inventory view comes from the authoritative sheet data.
              delete invCache['2026'];
              delete invCache['2021'];
              delete invCache['2015'];
              delete invCache['summary'];
              delete invCache['class'];
            }
            // Return the Log Tool Event form to a fresh blank state immediately
            // after a successful save, while leaving the success confirmation visible.
            resetForm(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            alert('Error saving: ' + res.error);
          }
        })
        .catch(function(err) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Submit Tool Event</span>';
          alert('Could not save locally: ' + err.message);
        });
    }
    function resetForm(preserveSuccess) {
      // Return the Log Tool Event form to a fresh blank state.
      document.getElementById('employee').value = '';
      document.querySelectorAll('.employee-tile').forEach(function(button) {
        button.className = 'employee-tile choice-tile';
        button.setAttribute('aria-pressed', 'false');
      });

      document.getElementById('itemSearch').value = '';
      document.getElementById('quantity').value = '1';
      setStatusQuantityMode(false);
      document.getElementById('notes').value = '';
      document.getElementById('quickFillNotice').classList.add('hidden');
      document.getElementById('clearBtn').classList.add('hidden');
      document.getElementById('autocompleteList').classList.add('hidden');

      if (!preserveSuccess) {
        document.getElementById('successBox').classList.add('hidden');
      }

      // Clear the selected main event and hide all event-specific fields.
      currentAction = '';
      document.querySelectorAll('.action-tab').forEach(function(tab) {
        tab.className = 'action-tab p-3 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 flex flex-col justify-between hover:bg-slate-100 font-semibold text-left min-h-[66px]';
        tab.setAttribute('aria-pressed', 'false');
      });
      document.querySelectorAll('.tab-content').forEach(function(sec) {
        sec.classList.add('hidden');
      });

      // Clear location/source selections that should start fresh on each event.
      [
        'whichVanRestocked',
        'needsReplacementLocation',
        'vanOrLocationBroke',
        'repairedMovedTo',
        'transferMovedFrom',
        'transferMovedTo'
      ].forEach(function(id) {
        const select = document.getElementById(id);
        if (!select) return;
        select.selectedIndex = -1;
        syncChoiceTiles(select);
      });

      // Return replacement questions to their neutral defaults.
      const replaced = document.getElementById('didYouReplace');
      replaced.value = 'No replacement available';
      syncChoiceTiles(replaced);
      onReplaceChange(replaced.value);

      document.getElementById('qtyRepairedBin').value = '0';
      document.getElementById('qtyClassStock').value = '0';

      const needsStatus = document.getElementById('needsReplacementStatus');
      needsStatus.value = 'Not replaced yet';
      syncChoiceTiles(needsStatus);
      onNeedsReplacementChange(needsStatus.value);
      document.getElementById('needsRestockQty').value = '1';

      // Restore the default visible wording for an empty form.
      configureSelectedItemMode();
    }
  </script>
</body>
</html>
